name: ETN Snapshot

# Alle 30 Minuten ein Snapshot (vorher alle 6h) - damit Top Movers/Activity
# zeitnah aktuell bleiben. Kostenrechnung: ~48 Laeufe/Tag * ~1 Min ~= 1.440
# Minuten/Monat, klar unter dem Gratis-Kontingent von 2.000 Min/Monat fuer
# private Repos (bei einem OEFFENTLICHEN Repo unbegrenzt). GitHub startet
# Cron-Jobs oft mit einigen Minuten Verzoegerung - bei 30 Minuten Takt spuerbar,
# aber unkritisch.
on:
  schedule:
    # 7 und 37 statt 0 und 30: Zur vollen und halben Stunde starten die
    # Cronjobs der halben Welt, und der Explorer von Electroneum hat dann
    # ohnehin am meisten zu tun. Ein paar Minuten versetzt trifft die Spitze
    # nicht. Am Abstand von 30 Minuten aendert das nichts.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      top_n:
        description: "Wie viele Adressen erfassen"
        required: false
        default: "3000"

concurrency:
  group: etn-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Schema nachziehen - aber nur einmal am Tag.
      #
      # Die schweren Jobs bringen ihr Schema selbst mit, laufen aber nur
      # woechentlich. Braeuchte der Snapshot selbst einmal eine neue Spalte,
      # stuende er bis zu sieben Tage lang auf einer Datenbank, die sie nicht
      # kennt. Hier bei JEDEM Lauf zu migrieren waeren dagegen 192 sinnlose
      # Anlaeufe taeglich - darum die Stunde als Schalter.
      # Best effort: schlaegt das fehl, laeuft der Job trotzdem. Am 06.09.
      # hat ein erschoepftes D1-Schreibkontingent hier die Boersen-Erkennung
      # blockiert, obwohl sie das neue Schema gar nicht brauchte. Braucht ein
      # Job wirklich eine neue Spalte, scheitert er daran selbst - mit einer
      # Meldung, die sagt, welche.
      - name: Migrationen anwenden (einmal taeglich)
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$(date -u +%H)" = "04" ]; then
            node scripts/apply-migrations.mjs --remote
          else
            echo "uebersprungen - laeuft einmal taeglich zur Stunde 04 UTC"
          fi

      - name: Snapshot ziehen und nach D1 schreiben
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ingest-remote.mjs ${{ github.event.inputs.top_n || '3000' }}
