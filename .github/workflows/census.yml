name: ETN Tier Census

# Woechentlich statt alle 6h: die unteren Tiers (Crab bis Microbe) bewegen sich im
# Cent-Bereich und brauchen keine hohe Aufloesung - siehe die Begruendung in
# src/tiers.js ("Zwei Geschwindigkeiten"). Wer es eilig hat, kann im Dashboard
# jederzeit "Run full census now" druecken (hoechstens einmal alle 24h, siehe
# /api/census/trigger in src/index.js) statt auf den Wochenlauf zu warten.
on:
  schedule:
    - cron: "30 3 * * 0" # jeden Sonntag 03:30 UTC
  workflow_dispatch:
    inputs:
      depth:
        description: "Wie tief maximal paginiert wird (Adressen)"
        required: false
        default: "90000"

# Alle Explorer-lastigen Jobs teilen sich EINE Warteschlange.
#
# Die Drossel in src/blockscout.js (~3 Anfragen/s) wirkt nur innerhalb eines
# Prozesses. Zwei gleichzeitige Laeufe sind zwei Prozesse und damit doppelte
# Last auf dem Explorer - genau so ist beim Aufsetzen ein Backfill parallel
# zum Census gestartet worden. Getrennte Gruppen (etn-census, etn-clusters,
# ...) haben das nicht verhindert, weil sie sich gegenseitig nicht kennen.
#
# Der Snapshot bleibt bewusst DRAUSSEN: er ist kurz, laeuft alle 30 Minuten
# und duerfte sonst 25 Minuten hinter einem Census warten - das wuerde Loecher
# in die Zeitreihe reissen.
concurrency:
  group: etn-explorer-schwer
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrationen anwenden
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/apply-migrations.mjs --remote
      - name: Tiefenzaehlung
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/census-remote.mjs ${{ github.event.inputs.depth || '90000' }}
