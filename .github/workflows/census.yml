name: ETN Tier Census

# Monatlich statt alle 6h: die unteren Tiers (Crab bis Microbe) bewegen sich im
# Cent-Bereich und brauchen keine hohe Aufloesung - siehe die Begruendung in
# src/tiers.js ("Zwei Geschwindigkeiten"). Wer es eilig hat, kann im Dashboard
# jederzeit "Run full census now" druecken (hoechstens einmal alle 24h, siehe
# /api/census/trigger in src/index.js) statt auf den Monatslauf zu warten.
on:
  schedule:
    - cron: "30 3 1 * *" # am 1. jedes Monats, 03:30 UTC
  workflow_dispatch:
    inputs:
      depth:
        description: "Wie tief maximal paginiert wird (Adressen)"
        required: false
        default: "90000"

concurrency:
  group: etn-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tiefenzaehlung
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/census-remote.mjs ${{ github.event.inputs.depth || '90000' }}
