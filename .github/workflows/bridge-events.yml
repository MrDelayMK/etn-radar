name: ETN Bridge Events

# Sucht in den internen Transfers der Bridge die grossen Einzelbetraege
# (ab 500.000 ETN, siehe src/bridge-events.js) und buendelt sie nach Tag.
# Die Bridge hat keine normalen Transaktionen, nur interne - der Lauf holt
# darum eine einzige, durchgehende Seitenkette und filtert daraus.
#
# Die Historie reicht bis zum 03.03.2024 zurueck und ist nur von der neuesten
# Seite aus rueckwaerts erreichbar: einmal komplett sind das rund zwei Stunden.
# Der Lauf merkt sich, wie weit er gekommen ist, und setzt beim naechsten Mal
# genau dort fort (Tabelle bridge_scan). Die ersten Laeufe sind lang, spaetere
# kosten nur noch die paar Seiten seit dem letzten Mal - daher das grosszuegige
# Zeitlimit unten.
#
# Woechentlich automatisch, jederzeit auch per Knopf.
on:
  schedule:
    - cron: "30 3 * * 1" # jeden Montag 03:30 UTC
  workflow_dispatch:
    inputs:
      minuten:
        description: "Zeitbudget fuer den Weg zurueck in die Historie (leer = 100 Minuten)"
        required: false
        default: ""

# Gemeinsame Warteschlange aller Explorer-lastigen Jobs, siehe census.yml.
concurrency:
  group: etn-explorer-schwer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Best effort: schlaegt das fehl, laeuft der Job trotzdem. Am 06.09.
      # hat ein erschoepftes D1-Schreibkontingent hier die Boersen-Erkennung
      # blockiert, obwohl sie das neue Schema gar nicht brauchte. Braucht ein
      # Job wirklich eine neue Spalte, scheitert er daran selbst - mit einer
      # Meldung, die sagt, welche.
      - name: Migrationen anwenden
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/apply-migrations.mjs --remote
      - name: Bridge-Ereignisse analysieren
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bridge-events-remote.mjs "${{ github.event.inputs.minuten }}"
