name: ETN Bridge Events

# Findet ungewoehnliche Bridge-Abfluss-Tage (Median x3, siehe
# src/bridge-events.js) und verfolgt zurueck, welche Wallets an diesem Tag
# ETN erhalten haben. Guenstig: die Bridge hat keine normalen Transaktionen,
# nur interne - deren Historie ist so duenn belegt, dass wenige Seiten schon
# Wochen zurueckreichen. Woechentlich automatisch, jederzeit auch per Knopf.
on:
  schedule:
    - cron: "30 3 * * 1" # jeden Montag 03:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Nur die N groessten Ausreisser-Tage analysieren (leer = Standard: 8)"
        required: false
        default: ""

# Gemeinsame Warteschlange aller Explorer-lastigen Jobs, siehe census.yml.
concurrency:
  group: etn-explorer-schwer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bridge-Ereignisse analysieren
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bridge-events-remote.mjs "${{ github.event.inputs.limit }}"
